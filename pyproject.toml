[project]
name = "mnist-cnn"
version = "0.1.0"
description = "PyTorch CNN for MNIST digit recognition"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
